id: meeting-summary-draft
name: Meeting Summary Draft
description: Produces a concise action-oriented meeting summary from supplied notes.

steps:
  - id: organize-notes
    name: Organize Notes
    employee: japanese-document-writer
    instructions: |
      Create a concise Japanese Markdown meeting summary from the supplied
      notes. Separate decisions, open questions, and action items. Preserve
      owners and dates only when explicitly present. Do not invent commitments.
      Return only the summary.
    business_approval_required: true
    artifact_content_type: text/markdown

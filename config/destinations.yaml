# Canonical non-secret runtime destination settings.
# credential contains an environment-variable name only; never store a key here.
destinations:
  opencode-go-chat:
    protocol: openai-chat-completions
    endpoint: https://opencode.ai/inference/go/openai/v1/chat/completions
    credential: OPENCODE_API_KEY
    models:
      - deepseek-v4-pro
      - deepseek-v4.1-flash
      - glm-5.3-flash
    headers:
      User-Agent: ai-office/1.0
      x-opencode-session: "{run_session}"

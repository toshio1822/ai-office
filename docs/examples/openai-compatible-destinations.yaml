destinations:
  opencode-zen:
    protocol: openai-responses
    endpoint: https://opencode.ai/zen/v1/responses
    credential: OPENCODE_API_KEY
    models:
      # Replace with a currently documented Responses-compatible Zen model.
      - replace-with-approved-responses-model

  internal-chat-gateway:
    protocol: openai-chat-completions
    endpoint: https://ai-gateway.example.com/v1/chat/completions
    credential: INTERNAL_CHAT_GATEWAY_API_KEY
    models:
      - approved-chat-model

  # Illustrative OpenCode Go destination. Go requires an identifying
  # User-Agent and a stable per-Run session header; see
  # docs/openai-compatible-destinations.md for the caveats and confirm
  # acceptable use before any live canary.
  opencode-go:
    protocol: openai-responses
    endpoint: https://opencode.ai/zen/go/v1/responses
    credential: OPENCODE_API_KEY
    models:
      - gpt-6-luna
    headers:
      User-Agent: ai-office/1.0
      x-opencode-session: "{run_session}"

  # Current OpenCode Go Chat Completions candidate for the bounded code-analysis
  # pilot. Confirm model entitlement with the operator at the live-run gate.
  opencode-go-glm-chat:
    protocol: openai-chat-completions
    endpoint: https://opencode.ai/zen/go/v1/chat/completions
    credential: OPENCODE_API_KEY
    models:
      - glm-5.3-flash
    headers:
      User-Agent: ai-office/1.0
      x-opencode-session: "{run_session}"
